[package]
name = "fj_widget"
version = "0.1.0"
edition = "2021"

[dependencies]
tao = "0.36"
wry = "0.56"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
