[package]
name = "pnl_widget_gdi"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pnl_widget_gdi"
path = "src/main.rs"

[dependencies]
winapi = { version = "0.3", features = [
    "winuser", "wingdi", "windowsx", "libloaderapi", "winuser",
    "synchapi", "winbase", "minwindef", "windef", "winnls", "wincodec", "errhandlingapi",
] }
minreq = { version = "2", features = ["json-using-serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"