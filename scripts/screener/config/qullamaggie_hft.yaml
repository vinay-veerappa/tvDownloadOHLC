strategy_id: "qullamaggie_hft"
version: "1.1.0"
author: "Kristjan Qullamaggie"
description: "High Tight Flag (HTF) - 100%+ run-up, ATR tightening, volume dry-up, fast momentum"

global_regime_required: ["BULL_EXPLOSIVE", "BULL_CHOPIER"]

filters:
  price_min: 10.0
  avg_volume_min: 500000

rules:
  - name: "momentum_alignment"
    expression: "ma_aligned_fast_momentum == True"
    
  - name: "historic_runup"
    expression: "runup_60d >= 1.5"
    
  - name: "vcp_tightening"
    expression: "vcp_tightness_ratio <= 0.70"
    
  - name: "volume_dryup"
    expression: "rvol_20 <= 1.0"

