strategy_id: "qullamaggie_hft"
version: "1.0.0"
author: "Kristjan Qullamaggie"
description: "High Tight Flag breakout momentum strategy"

global_regime_required: ["BULL_EXPLOSIVE", "BULL_CHOPIER"]

filters:
  price_min: 5.0
  adr_pct_min: 3.5
  
rules:
  - name: "ma_alignment"
    expression: "Close > ema10 and ema10 > ema20 and ema20 > sma50"
  - name: "tightness"
    expression: "dist_10ema_pct <= 3.5"
