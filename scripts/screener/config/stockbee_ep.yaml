strategy_id: "stockbee_ep"
version: "1.1.0"
author: "Pradeep Bonde (Stockbee)"
description: "Episodic Pivot (EP) - Massive volume gap up usually on earnings or news"

global_regime_required: ["BULL_EXPLOSIVE", "BULL_CHOPIER", "BEAR_PROTECTIVE"]

filters:
  price_min: 5.0
  avg_volume_min: 500000

rules:
  - name: "top_industry"
    expression: "industry_rs_rank >= 85"
    
  - name: "gap_up"
    expression: "gap_up > 1.08"
    
  - name: "closing_strength"
    expression: "closing_range_strength > 0.5"
    
  - name: "volume_surge"
    expression: "rvol_20 > 3.0"
