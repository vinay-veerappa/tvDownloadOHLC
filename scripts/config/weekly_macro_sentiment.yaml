# Weekly Macro Sentiment Configuration
#
# This file provides CURRENT-WEEK macro context that the KB cannot supply.
# The KB has historical ICT methodology (how FOMC weeks behave, what news
# windows are). This YAML provides the "why does it matter THIS week" narrative.
#
# Update this file at the start of each trading week (Sunday/Monday).
# The narrative engine loads it automatically via load_weekly_macro_sentiment().
# If the file is missing or the week key doesn't match, the block is skipped
# gracefully (KB calendar context still provides methodology).
#
# The week key format is ISO: YYYY-Www (e.g. 2026-W30)
# The engine matches against the target_date's ISO week.

# ── Template (uncomment and edit for the current week) ──────────────

